<ion-header>
  <ion-toolbar>
    <ion-title>Create account</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="signup-page" fullscreen>
  <div class="auth-shell">
    <div class="header-copy">
      <p class="eyebrow">Join us</p>
      <h2>Sign up with Google to book your service faster.</h2>
    </div>

    <div class="auth-card">
      <div class="brand-row">
        <div class="google-badge">G</div>
        <span>One tap access</span>
      </div>

      <ion-button expand="block" shape="round" class="google-btn" routerLink="/home">
        <span class="button-content">
          <span class="g-icon">G</span>
          <span>Sign up with Google</span>
        </span>
      </ion-button>

      <div class="divider"><span>or</span></div>

      <ion-button expand="block" fill="outline" shape="round" routerLink="/login">
        I already have an account
      </ion-button>
    </div>

    <p class="bottom-text">
      Already have an account?
      <a routerLink="/login">Log in</a>
    </p>
  </div>
</ion-content>
