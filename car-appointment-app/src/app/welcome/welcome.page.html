<ion-content class="welcome-page" fullscreen>
  <div class="welcome-shell">
    <div class="brand-row">
      <div class="brand-badge">C</div>
      <span>CarCare</span>
    </div>

    <div class="hero-card">
      <p class="eyebrow">Smart car care</p>
      <h1>Schedule your next service in minutes.</h1>
      <p class="subtitle">
        Book oil changes, tire checks, brake services, and diagnostics from your phone.
      </p>
    </div>

    <div class="feature-list">
      <div class="feature-item">
        <span class="icon">✓</span>
        <span>Fast booking</span>
      </div>
      <div class="feature-item">
        <span class="icon">✓</span>
        <span>Live availability</span>
      </div>
      <div class="feature-item">
        <span class="icon">✓</span>
        <span>Expert mechanics</span>
      </div>
    </div>

    <div class="cta-stack">
      <ion-button expand="block" shape="round" routerLink="/login">Sign in</ion-button>
      <ion-button expand="block" fill="outline" shape="round" routerLink="/signup">Create account</ion-button>
    </div>
  </div>
</ion-content>
