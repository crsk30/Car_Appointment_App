<ion-header>
  <ion-toolbar>
    <ion-title>Sign in</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="login-page" fullscreen>
  <div class="auth-shell">
    <div class="header-copy">
      <p class="eyebrow">Welcome back</p>
      <h2>Manage your car service appointments.</h2>
    </div>

    <div class="form-card">
      <ion-item lines="none">
        <ion-label position="stacked">Email</ion-label>
        <ion-input type="email" placeholder="you@example.com" value="alex@carcare.com"></ion-input>
      </ion-item>

      <ion-item lines="none">
        <ion-label position="stacked">Password</ion-label>
        <ion-input type="password" placeholder="Enter your password" value="password123"></ion-input>
      </ion-item>

      <div class="aux-row">
        <span>Remember me</span>
        <a routerLink="/signup">Forgot password?</a>
      </div>

      <ion-button expand="block" shape="round" routerLink="/home">Continue</ion-button>
    </div>

    <p class="bottom-text">
      Don’t have an account?
      <a routerLink="/signup">Sign up</a>
    </p>
  </div>
</ion-content>
