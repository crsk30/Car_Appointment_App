<ion-header>
  <ion-toolbar>
    <ion-title>Welcome back</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="login-page" fullscreen>
  <div class="auth-shell">
    <div class="header-copy">
      <p class="eyebrow">Continue</p>
      <h2>Log in to manage your next car service.</h2>
    </div>

    <div class="auth-card">
      <div class="brand-row">
        <div class="google-badge">G</div>
        <span>Google account</span>
      </div>

      <ion-button expand="block" shape="round" class="google-btn" routerLink="/home">
        <span class="button-content">
          <span class="g-icon">G</span>
          <span>Continue with Google</span>
        </span>
      </ion-button>

      <div class="divider"><span>or</span></div>

      <ion-button expand="block" fill="outline" shape="round" routerLink="/signup">
        Create account
      </ion-button>
    </div>

    <p class="bottom-text">
      Need an account?
      <a routerLink="/signup">Sign up</a>
    </p>
  </div>
</ion-content>
